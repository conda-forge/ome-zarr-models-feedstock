schema_version: 1

context:
  name: ome-zarr-models
  version: "1.8.0"
  python_min: '3.12'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ome_zarr_models-${{ version }}.tar.gz
  sha256: db2715047617682b0c1f32f993ac4d3b58dd0cf672ea0f3336ffafc19e9e3d5d

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - hatch-vcs
    - pip
  run:
    - python >=${{ python_min }}
    - numpy
    - zarr >=3.1.1
    - pydantic >=2.11.5,<2.13
    - pydantic-zarr >=0.8.2

tests:
  - python:
      imports:
        - ome_zarr_models
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A minimal Python package for reading OME-Zarr (meta)data
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ome-zarr-models/ome-zarr-models-py

extra:
  recipe-maintainers:
    - imagejan
    - dstansby
    - d-v-b
